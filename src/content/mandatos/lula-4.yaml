presidente: lula
ordem: 4
forma: direta
inicio: 2027
fim: 2030
eleicao: 2026
resumo: >-
  Reeleito em 25/10/2026 com 51,79% dos votos válidos contra Flávio Bolsonaro (48,21%).
  O plano de governo tem 13 eixos e cerca de 84 páginas; críticos apontam que não traz
  estimativa de custo das promessas.
planoDeGoverno: https://static.poder360.com.br/uploads/2026/08/Programa-Governo-LULA-2026.pdf

promessas:
  - titulo: Acabar com a escala 6x1, reduzindo a jornada de 44 para 40 horas sem cortar salário
    tema: Trabalho
    status: em_andamento
    analise: >-
      Aprovada pelo Senado por 75 a 1 em 14/10/2026 e promulgada como Emenda Constitucional 141 em
      16/10/2026, nove dias antes do 2º turno (Flávio Bolsonaro também votou a favor). A escala vira 5x2,
      com máximo de 42 horas semanais 60 dias após a publicação e 40 horas cerca de 14 meses depois, sem
      redução de salário. A cobrança agora é a implantação e o efeito sobre o emprego.
    fontes:
      - titulo: Congresso promulga emenda do fim da 6x1; escala 5x2 começa em 60 dias — Agência Brasil
        url: https://agenciabrasil.ebc.com.br/politica/noticia/2026-10/congresso-promulga-emenda-do-fim-da-6x1-escala-5x2-comeca-em-60-dias
      - titulo: Senado aprova fim da escala 6x1 e redução da jornada — Agência Brasil
        url: https://agenciabrasil.ebc.com.br/politica/noticia/2026-10/senado-aprova-fim-da-escala-6x1-e-reducao-da-jornada-de-trabalho
      - titulo: Confira as promessas de Lula em caso de reeleição — O Povo
        url: https://www.opovo.com.br/noticias/politica/eleicoes/2026/10/24/confira-as-promessas-de-lula-em-caso-de-reeleicao.html
    verificado: true

  - titulo: Criar o Ministério da Segurança Pública (após aprovação da PEC)
    tema: Segurança
    status: em_andamento
    analise: >-
      Promessa repetida de 2022, quando não foi cumprida. A condição que Lula impôs foi atendida: o Senado
      aprovou a PEC da Segurança Pública por 75 a 0 em 03/11/2026, e o texto vai à promulgação. Em
      05/11/2026, Lula anunciou que vai criar o ministério por medida provisória, separando a pasta do
      Ministério da Justiça. Até 10/11/2026, a MP ainda não tinha sido publicada no Diário Oficial.
    fontes:
      - titulo: Confira as promessas de Lula em caso de reeleição — O Povo
        url: https://www.opovo.com.br/noticias/politica/eleicoes/2026/10/24/confira-as-promessas-de-lula-em-caso-de-reeleicao.html
      - titulo: Senado aprova PEC da Segurança Pública sem redução da maioridade penal — Agência Brasil
        url: https://agenciabrasil.ebc.com.br/politica/noticia/2026-11/senado-aprova-pec-da-seguranca-publica-sem-reducao-da-maioridade-penal
      - titulo: Após eleições, foco de Lula é consolidar Ministério da Segurança este mês — Metrópoles
        url: https://www.metropoles.com/brasil/apos-eleicoes-foco-de-lula-e-consolidar-ministerio-da-seguranca-este-mes
      - titulo: Lula vai criar Ministério da Segurança Pública com Medida Provisória — Agência Brasil
        url: https://agenciabrasil.ebc.com.br/politica/noticia/2026-11/lula-vai-criar-ministerio-da-seguranca-publica-com-medida-provisoria
    verificado: true

