  - titulo: Zerar impostos sobre a cesta básica e ampliar o cashback de impostos
    tema: Custo de vida
    status: em_andamento
    analise: >-
      Boa parte já está aprovada: a reforma tributária (Lei Complementar 214/2025, do 3º mandato) zera a CBS
      e o IBS sobre os alimentos da Cesta Básica Nacional e cria o cashback para famílias de baixa renda. A
      CBS começa a ser cobrada em janeiro de 2027, e o cashback da CBS vale a partir daí (o do IBS, a partir de
      2029). A cobrança agora é a implantação no prazo e o que, de fato, será "ampliado" além do que a lei
      já prevê.
    fontes:
      - titulo: Confira as promessas de Lula em caso de reeleição — O Povo
        url: https://www.opovo.com.br/noticias/politica/eleicoes/2026/10/24/confira-as-promessas-de-lula-em-caso-de-reeleicao.html
      - titulo: Lei Complementar 214/2025 (IBS, CBS, cesta básica e cashback) — Planalto
